<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinguaTrack</title>
    <!-- Applique le thème enregistré avant le premier rendu (getThemeScript de @quickadui/theme) -->
    <script>
      (function(){try{var m=localStorage.getItem("quickadui-theme");if(m==="light"||m==="dark"){document.documentElement.setAttribute("data-theme",m);}else{document.documentElement.removeAttribute("data-theme");}}catch(e){}})();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
